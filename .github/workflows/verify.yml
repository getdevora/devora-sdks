name: Verify SDKs
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      DEVORA_SDK_API_ORIGIN: https://api.example.com
      DEVORA_SDK_DASHBOARD_ORIGIN: https://dashboard.example.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm install --global bun@1.3.14
        working-directory: ${{ runner.temp }}
      - run: python3 -m pip install uv==0.12.9
      - run: bun install --frozen-lockfile
      - run: bun run check-types:sdks
      - run: bun run test:sdks
      - run: bun run test:python-sdks
      - run: bun run verify:sdks-publish
      - run: bun run verify:python-publish
      - run: bun run smoke:sdks-publish
